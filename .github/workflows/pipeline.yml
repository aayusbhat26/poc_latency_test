# Indexing trigger: Added comment
name: End-to-End Medallion Pipeline

on:
  workflow_dispatch: # Run manually

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Spark 3.5.0 dies on the JDK the runner image now ships with:
      # "getSubject is not supported" comes from JDK 24, which Spark 3.5
      # predates. Pin Java 17, which Spark 3.5 supports.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Execute Master Pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python main.py